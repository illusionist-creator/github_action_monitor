name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # build.mjs has no dependencies, so this job needs no install step —
      # it cannot be broken by a devDependency that only the tests use.
      - name: Build fresh rather than trusting the committed artifact
        run: node build.mjs

      - name: Stage the single file
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on the first time this runs, so the repo needs no manual
          # settings change to publish.
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
