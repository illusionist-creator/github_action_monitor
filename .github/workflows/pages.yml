name: Deploy to GitHub Pages

# Manual until Pages is switched on for this repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# That toggle needs repository-admin rights, which the workflow's GITHUB_TOKEN
# does not have — `configure-pages` with `enablement: true` fails with
# "Resource not accessible by integration". Leaving this on `push` would mean a
# red X on every commit for a reason no commit can fix, so it waits to be asked.
# Once the setting is flipped, add back:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # build.mjs has no dependencies, so this job needs no install step —
      # it cannot be broken by a devDependency that only the tests use.
      - name: Build fresh rather than trusting the committed artifact
        run: node build.mjs

      - name: Stage the single file
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
